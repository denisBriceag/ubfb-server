services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ubfb
      POSTGRES_PASSWORD: ubfb
      POSTGRES_DB: ubfb
    ports:
      # 5433 on the host, not 5432: a Homebrew Postgres commonly holds 5432
      # already, and it wins `localhost:5432` because it binds 127.0.0.1
      # explicitly while Docker binds the wildcard. The app would then connect
      # to the host server while this one sat there looking healthy. Inside
      # the compose network the app service still talks to `postgres:5432`.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ubfb -d ubfb']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      # 6380 for the same reason Postgres uses 5433: a host Redis on
      # 127.0.0.1:6379 silently wins `localhost:6379` over Docker's wildcard
      # bind. Inside the compose network the app still uses `redis:6379`.
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # Infrastructure only by default: `docker compose up` brings up Postgres,
  # Redis and Mailpit and stops there, leaving the app to run on the host via
  # `pnpm start:dev`. The profile keeps the containerised app available for
  # anyone who wants it — `docker compose --profile app up` behaves as before.
  app:
    profiles: ['app']
    build:
      context: .
      target: dev
    command: sh -c "pnpm db:init && pnpm start:dev"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ubfb
      DB_PASSWORD: ubfb
      DB_NAME: ubfb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  redisdata:
